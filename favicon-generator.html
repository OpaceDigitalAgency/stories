<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Generator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }
        
        .favicon-container {
            width: 64px;
            height: 64px;
            background-color: white;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .letter {
            font-size: 40px;
            font-weight: bold;
            color: #4361ee; /* Same blue color as the logo */
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            line-height: 1;
        }
        
        .instructions {
            margin-left: 20px;
            max-width: 400px;
        }
        
        h1 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="favicon-container">
        <div class="letter">S</div>
    </div>
    
    <div class="instructions">
        <h1>Favicon Generator</h1>
        <p>This is a simple favicon with the letter "S" in the same blue color as the Stories From The Web logo.</p>
        <p>To use this as a favicon:</p>
        <ol>
            <li>Take a screenshot of the square on the left</li>
            <li>Crop it to just the square</li>
            <li>Save it as "favicon.png" in the public directory</li>
        </ol>
    </div>
</body>
</html>
