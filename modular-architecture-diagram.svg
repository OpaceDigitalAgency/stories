<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa" />
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">Stories Admin Modular Architecture</text>
  
  <!-- Central Components Box -->
  <rect x="250" y="80" width="300" height="180" rx="10" ry="10" fill="#4361ee" stroke="#2a3eb1" stroke-width="2" />
  <text x="400" y="110" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Centralized Components</text>
  <text x="400" y="140" font-family="Arial" font-size="14" text-anchor="middle" fill="white">admin/includes/</text>
  
  <text x="400" y="170" font-family="Arial" font-size="12" text-anchor="middle" fill="white">header.php</text>
  <text x="400" y="190" font-family="Arial" font-size="12" text-anchor="middle" fill="white">footer.php</text>
  <text x="400" y="210" font-family="Arial" font-size="12" text-anchor="middle" fill="white">auth-check.php, db-connect.php</text>
  <text x="400" y="230" font-family="Arial" font-size="12" text-anchor="middle" fill="white">table-component.php, bulk-actions-component.php</text>
  
  <!-- Admin Content Pages Box -->
  <rect x="50" y="300" width="220" height="200" rx="10" ry="10" fill="#20c997" stroke="#0ca678" stroke-width="2" />
  <text x="160" y="330" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Admin Content Pages</text>
  <text x="160" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="white">admin/content/</text>
  
  <text x="160" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="white">stories.php</text>
  <text x="160" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="white">authors.php</text>
  <text x="160" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="white">author-delete.php (Fixed)</text>
  <text x="160" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="white">contacts.php (Fixed)</text>
  <text x="160" y="470" font-family="Arial" font-size="12" text-anchor="middle" fill="white">tags.php, games.php, etc.</text>
  
  <!-- Admin Root Pages Box -->
  <rect x="530" y="300" width="220" height="200" rx="10" ry="10" fill="#fd7e14" stroke="#e8590c" stroke-width="2" />
  <text x="640" y="330" font-family="Arial" font-size="18" text-anchor="middle" fill="white" font-weight="bold">Admin Root Pages</text>
  <text x="640" y="360" font-family="Arial" font-size="14" text-anchor="middle" fill="white">admin/</text>
  
  <text x="640" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="white">dashboard.php</text>
  <text x="640" y="410" font-family="Arial" font-size="12" text-anchor="middle" fill="white">login.php (Standalone)</text>
  <text x="640" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="white">logout.php (Processing)</text>
  
  <!-- Arrows from Central Components to Content Pages -->
  <path d="M 250 170 L 180 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  <path d="M 550 170 L 620 300" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />
  
  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="50" y="520" width="700" height="60" rx="5" ry="5" fill="#e9ecef" stroke="#ced4da" stroke-width="1" />
  <text x="400" y="545" font-family="Arial" font-size="16" text-anchor="middle" fill="#333" font-weight="bold">Key Benefits</text>
  <text x="400" y="565" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Single Source of Truth • Consistency • Maintainability • Separation of Concerns • Reusability</text>
  
  <!-- Fixed Issues Callout -->
  <rect x="290" y="420" width="220" height="80" rx="5" ry="5" fill="#f8f9fa" stroke="#ced4da" stroke-width="1" />
  <text x="400" y="440" font-family="Arial" font-size="14" text-anchor="middle" fill="#333" font-weight="bold">Fixed Issues</text>
  <text x="400" y="460" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">• author-delete.php: Header warning</text>
  <text x="400" y="475" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">• contacts.php: Duplicate header</text>
  <text x="400" y="490" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">• login.php: Centered login box</text>
</svg>
