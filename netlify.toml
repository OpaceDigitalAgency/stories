[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/*"
  to = "https://api.storiesfromtheweb.org/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/tags"
  to = "/categories"
  status = 301
  force = true

[[redirects]]
  from = "/tags/*"
  to = "/categories/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/story-*"
  to = "/reviews"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/story-*/write"
  to = "/reviews"
  status = 301
  force = true

[[redirects]]
  from = "/reviews/author-*"
  to = "/reviews"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  PUBLIC_API_URL = "https://api.storiesfromtheweb.org/api/v1"
  PUBLIC_ASSETS_URL = "/images"
  NODE_VERSION = "18"