[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PUBLIC_API_URL = "/.netlify/functions/api"

[context.production.environment]
  PUBLIC_API_URL = "/.netlify/functions/api"

[context.deploy-preview.environment]
  PUBLIC_API_URL = "/.netlify/functions/api"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Fallback for main site if SPA fails to load
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback for API if Netlify function fails
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false