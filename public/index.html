<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stories From The Web</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #4361ee;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .logo {
            max-width: 200px;
            margin: 0 auto;
            display: block;
        }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #3a0ca3;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #4361ee;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #3a0ca3;
        }
        .loading-container {
            margin-top: 2rem;
            text-align: center;
        }
        .loading-spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 5px solid rgba(67, 97, 238, 0.3);
            border-radius: 50%;
            border-top-color: #4361ee;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        footer {
            background-color: #f8f9fa;
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
    <script>
        // Redirect to the main app after a short delay
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.location.href = '/';
            }, 3000);
        });
    </script>
</head>
<body>
    <header>
        <img src="/logo-new2.png" alt="Stories From The Web" class="logo">
    </header>
    
    <main>
        <h1>Loading Stories From The Web</h1>
        <p>Please wait while we prepare your storytelling experience...</p>
        
        <div class="loading-container">
            <div class="loading-spinner"></div>
            <p>If you're not redirected automatically, please click the button below.</p>
            <a href="/" class="btn">Go to Homepage</a>
        </div>
    </main>
    
    <footer>
        &copy; 2023 Stories From The Web. All rights reserved.
    </footer>
</body>
</html>
