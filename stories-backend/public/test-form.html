<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Subscriber Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background-color: #4361ee;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Test Subscriber Form</h1>
    <p>Use this form to test the subscriber functionality</p>
    
    <form id="subscriberForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="feature">Feature:</label>
            <select id="feature" name="feature">
                <option value="premium stories">Premium Stories</option>
                <option value="games">Games</option>
                <option value="ai tools">AI Tools</option>
            </select>
        </div>
        
        <button type="submit">Submit</button>
    </form>
    
    <div id="result" class="result"></div>
    
    <script>
        document.getElementById('subscriberForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const feature = document.getElementById('feature').value;
            const resultDiv = document.getElementById('result');
            
            // Clear previous results
            resultDiv.className = 'result';
            resultDiv.style.display = 'none';
            
            // Show that we're submitting
            resultDiv.textContent = 'Submitting...';
            resultDiv.style.display = 'block';
            
            // Log the data we're sending
            console.log('Submitting data:', { email, feature });
            
            // Submit using fetch API
            fetch('save-subscriber.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, feature })
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                
                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = data.message || 'Subscription successful!';
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = data.error || 'An error occurred.';
                }
                
                resultDiv.style.display = 'block';
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.className = 'result error';
                resultDiv.textContent = 'An error occurred while submitting the form.';
                resultDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
